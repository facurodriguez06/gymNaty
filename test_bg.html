<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        :root { --bg-base: #000000; }
        body.light { --bg-base: #ffffff; --bg-panel: rgba(255,255,255,0.7); }
        html { background-color: var(--bg-base); }
        body { margin: 0; height: 100vh; }
        [class*="bg-slate-9"] { background-color: var(--bg-panel) !important; }
    </style>
</head>
<body class="light bg-slate-950">
    <h1>Hello World</h1>
</body>
</html>
