<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Vibrant Violet to Deep Indigo) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Top-Left Subtle Ambient Specular Light -->
    <radialGradient id="topGlow" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Neumorphic Drop Shadow for Glyph -->
    <filter id="softDepth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#312e81" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- iOS Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="116" fill="url(#topGlow)" />
  
  <!-- Subtle Inset Rim Border -->
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

  <!-- Iconic Minimalist Gym Glyph (Clean, Bold, Centered) -->
  <g filter="url(#softDepth)" fill="#ffffff">
    <!-- Central Grip Bar -->
    <rect x="176" y="238" width="160" height="36" rx="18" />

    <!-- Inner Calibrated Plates -->
    <rect x="142" y="166" width="38" height="180" rx="19" />
    <rect x="332" y="166" width="38" height="180" rx="19" />

    <!-- Outer Precision Plates -->
    <rect x="94" y="196" width="34" height="120" rx="17" />
    <rect x="384" y="196" width="34" height="120" rx="17" />

    <!-- Precision Bar Caps -->
    <rect x="76" y="244" width="12" height="24" rx="6" />
    <rect x="424" y="244" width="12" height="24" rx="6" />
  </g>
</svg>
