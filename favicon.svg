<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark OLED Slate Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vigor App Signature Gradient (Emerald to Electric Sky Cyan) -->
    <linearGradient id="vigorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Ambient Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Core Ambient Light -->
    <radialGradient id="ambientLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Soft Ambient Glow behind Dumbbell -->
  <circle cx="256" cy="256" r="180" fill="url(#ambientLight)" />

  <!-- Minimalist Modern Gym Dumbbell Glyph -->
  <g filter="url(#neonGlow)" fill="url(#vigorGrad)">
    <!-- Central Grip Bar -->
    <rect x="176" y="238" width="160" height="36" rx="18" />

    <!-- Inner Calibrated Plates -->
    <rect x="146" y="160" width="38" height="192" rx="19" />
    <rect x="328" y="160" width="38" height="192" rx="19" />

    <!-- Outer Calibrated Plates -->
    <rect x="96" y="196" width="34" height="120" rx="17" />
    <rect x="382" y="196" width="34" height="120" rx="17" />

    <!-- Precision Bar Tips -->
    <rect x="78" y="244" width="12" height="24" rx="6" />
    <rect x="422" y="244" width="12" height="24" rx="6" />
  </g>
</svg>
